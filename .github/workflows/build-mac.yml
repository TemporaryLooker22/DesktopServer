name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev electron@26.6.9

      - name: Build macOS DMG (macOS 10.13+ High Sierra & modern macOS)
        run: |
          npm run build:mac
          cp dist/DesktopServer-x64.dmg dist/DesktopServer.dmg || true
          cp dist/DesktopServer-x64.dmg dist/DesktopServer-HighSierra.dmg || true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DesktopServer-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

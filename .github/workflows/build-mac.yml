name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev electron@26.6.9

      - name: Build macOS 10.13 dyld shim (____chkstk_darwin)
        run: |
          mkdir -p bin/mac
          clang -dynamiclib -arch x86_64 -arch arm64 -mmacosx-version-min=10.13 -install_name @rpath/libchkstk.dylib build/chkstk.S -o bin/mac/libchkstk.dylib || clang -dynamiclib -arch x86_64 -arch arm64 -mmacosx-version-min=10.13 -install_name @rpath/libchkstk.dylib build/chkstk.c -o bin/mac/libchkstk.dylib
          ls -la bin/mac/libchkstk.dylib
          nm -gU bin/mac/libchkstk.dylib

      - name: Build macOS DMG (macOS 10.13+ High Sierra & modern macOS)
        run: |
          npx electron-builder --mac --x64 -p never
          hdiutil detach /Volumes/DesktopServer -force || true
          sleep 3
          npx electron-builder --mac --arm64 -p never
          hdiutil detach /Volumes/DesktopServer -force || true
          cp dist/DesktopServer-x64.dmg dist/DesktopServer.dmg || true
          cp dist/DesktopServer-x64.dmg dist/DesktopServer-HighSierra.dmg || true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DesktopServer-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            bin/mac/*.dylib
          if-no-files-found: error
